<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Clínica</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Panel de Administración Privado</h1>
        <nav>
            <ul>
                <li><a href="index.html">Volver a la web</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="panel-admin" style="padding: 40px 20px; max-width: 1000px; margin: 0 auto;">
            <h2 style="color: #0056b3; margin-bottom: 20px;">Agenda de Pacientes</h2>
            
            <div style="overflow-x: auto;">
                <table id="tabla-agenda" class="tabla-admin">
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Paciente</th>
                            <th>Teléfono</th>
                            <th>Motivo</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpo-tabla">
                        <!-- Las filas se insertarán aquí con JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- Carga la librería de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Carga la lógica del panel -->
    <script src="admin.js"></script>
</body>
</html>
